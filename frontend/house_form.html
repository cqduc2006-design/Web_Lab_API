<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Prediction Form</title>
  </head>

  <body>
    <form id="prediction-form">
      <label for="area">Area:</label>
      <input type="number" id="area" name="area" min="1" required />

      <label for="bedrooms">Bedrooms:</label>
      <input type="number" id="bedrooms" name="bedrooms" min="1" required />

      <label for="location">Location:</label>
      <select id="location" name="location">
        <option value="hanoi">Hanoi</option>
        <option value="hcmc">HCMC</option>
        <option value="other">Other</option>
      </select>

      <button type="submit">Predict</button>
    </form>

    <p id="result"></p>

    <script src="house_pred.js" defer></script>
  </body>
</html>
